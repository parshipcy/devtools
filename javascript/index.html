<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn JS devtools</title>
</head>

<body>
    <main class="container">
        <h1>Task Manager</h1>
        <form id="task-form">
            <input
                id="task-input"
                type="text"
                placeholder="Enter a task"
            >
            <button type="submit">
                Add Task
            </button>
        </form>
        <ul id="task-list"></ul>
    </main>
    <script src="script.js"></script>
</body>
</html>
